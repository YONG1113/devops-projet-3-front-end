<div class="card">
  <div><h2 class="card-header">ajouter un fichier</h2></div>

  <div class="card-body">
    <form [formGroup]="uploadForm" (ngSubmit)="onSubmit()">
      @if (file) {
        <div class="change-file-section">
          <div class="change-name-section">
            <div><img src="Vector.svg" /></div>
            <div class="file-name-label">
              <span>{{ file?.name || 'Veuillez sélectionner un fichier.' }}</span>
              <span>{{ formatFileSize(file.size) }}</span>
            </div>
          </div>
          <input #fileInput type="file" hidden (change)="changeFile($event)" />
          <button
            class="change-file-button"
            type="button"
            [disabled]="uploading"
            (click)="fileInput.click()"
          >
            changer
          </button>
        </div>
      }
      <div class="form-config">
        <div>
          <label for="password">Mot de passe</label>
          <input
            id="password"
            type="password"
            placeholder="Optionnel"
            formControlName="password"
            class="upload-input"
            autocomplete="new-password"
          />
          <div class="error-container"></div>
        </div>

        <div class="form-group">
          <label for="expirationDays">Expiration</label>

          <select class="upload-input" id="expirationDays" formControlName="expirationDays">
            <option [ngValue]="1">1 jour</option>
            <option [ngValue]="2">2 jours</option>
            <option [ngValue]="3">3 jours</option>
            <option [ngValue]="4">4 jours</option>
            <option [ngValue]="5">5 jours</option>
            <option [ngValue]="6">6 jours</option>
            <option [ngValue]="7">7 jours</option>
          </select>

          <div class="error-container">
            @if (submitted && form['expirationDays'].errors) {
              <div class="error-message">Veuillez choisir une durée entre 1 et 7 jours.</div>
            }
          </div>
        </div>
      </div>

      <div class="button-center">
        <button class="televerser-button" type="submit" [disabled]="!file || uploading || uploaded">
          <img src="Icon.svg" alt="" width="16" height="16" />
          televerser
        </button>
      </div>
      @if (message) {
        <p role="status">{{ message }}</p>
      }
    </form>
  </div>
</div>
