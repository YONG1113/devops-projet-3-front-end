<section class="download-card" aria-labelledby="download-title">
  <h2 id="download-title">Télécharger un fichier</h2>

  <div class="file-details">
    <img src="Vector.svg" alt="" width="24" height="24" />
    <div class="file-description">
      <span>{{ fileName }}</span>
      @if (size) {
        <span class="file-size">{{ size }}</span>
      }
    </div>
  </div>

  <p class="expiration-notice">
    <span aria-hidden="true">ⓘ</span>
    {{ expirationMessage }}
  </p>

  <form [formGroup]="downloadForm" (ngSubmit)="onSubmit()">
    @if (isProtectPassword) {
      <div class="password-field">
        <label for="download-password">Mot de passe</label>
        <input
          id="download-password"
          type="password"
          formControlName="password"
          placeholder="Saisissez le mot de passe"
          autocomplete="off"
        />
      </div>
      <div class="error-container">
        @if (submitted && form['password'].errors?.['required']) {
          <div class="error-message">Password is required</div>
        }
      </div>
    }
    <button class="download-button" type="submit" [disabled]="downloading">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      ></svg>
      Télécharger
    </button>
  </form>
  @if (message) {
    <p class="download-message" role="status">{{ message }}</p>
  }
</section>
