<div class="upload-section">
  <h1 class="upload-title">Tu veux partager un fichier ?</h1>
  <input #fileInput type="file" hidden (change)="upload($event)" />
  <button
    class="upload-button"
    type="button"
    [disabled]="uploading"
    (click)="fileInput.click()"
    aria-label="Partager un fichier"
  >
    <img class="upload-image" src="Frame3.svg" alt="" />
  </button>
</div>
